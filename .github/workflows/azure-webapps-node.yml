name: Node.js CI & Code Quality Audit

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  NODE_VERSION: '20.x'
  AZURE_WEBAPP_NAME: 'your-app-name'

jobs:
  build-and-audit:
    name: Build & Code Quality Audit
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js ${{ env.NODE_VERSION }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install Dependencies
      run: npm install

    - name: Run OxLint Zero-Warning Audit
      run: npm run lint

    - name: Run Production Vite Build
      run: npm run build

  deploy:
    name: Deploy to Azure WebApp (Optional)
    needs: build-and-audit
    if: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE != '' && env.AZURE_WEBAPP_NAME != 'your-app-name' }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
    - name: Build Application
      run: |
        npm install
        npm run build
    - name: Deploy to Azure WebApp
      uses: azure/webapps-deploy@v2
      with:
        app-name: ${{ env.AZURE_WEBAPP_NAME }}
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        package: './dist'
